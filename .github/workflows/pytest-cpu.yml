name: test-and-package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install CPU torch
        if: runner.os != 'macOS'
        run: |
          python -m pip install "torch>=2.2,<2.12" --index-url https://download.pytorch.org/whl/cpu

      - name: Install torch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install "torch>=2.2,<2.12"

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

  package-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build release artifacts
        run: ./scripts/build_release.sh "${{ runner.temp }}/release-dist"

      - name: Smoke-test wheel install
        run: ./scripts/test_wheel_install.sh "${{ runner.temp }}"/release-dist/*.whl

      - name: Retain checked distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/release-dist/*
          if-no-files-found: error
          retention-days: 14
